{% extends 'nav.html' %} {% block title %} Edit User - Sistem Peminjaman Buku SIPUSTAKA {% endblock %} {% block content %}
<div class="flex flex-col gap-6 text-sm">
  <!-- Back Button & Header -->
  <div class="flex items-center gap-3">
    <a href="{% url 'list_siswa' %}" class="text-slate-400 hover:text-white transition duration-200">
      <span class="material-icons-outlined text-xl">arrow_back</span>
    </a>
    <div>
      <p class="text-xs uppercase tracking-wider text-fuchsia-400 font-semibold mb-1">EDIT USER</p>
      <h3 class="text-2xl font-black text-white">Edit Data User</h3>
    </div>
  </div>

  <!-- Form Card -->
  <div class="rounded-[2rem] bg-slate-900/40 border border-slate-800/70 p-6 md:p-8 backdrop-blur-md shadow-xl max-w-2xl">
    <form id="form-edit-user" method="post" action="{% url 'edit_siswa' siswa.id %}" class="space-y-6">
      {% csrf_token %}

      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Nama Lengkap</span>
          <input name="nama" type="text" value="{{ siswa.nama }}" required
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-fuchsia-500/50 focus:ring-2 focus:ring-fuchsia-500/20 transition duration-200" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Kelas</span>
          <input name="kelas" type="text" value="{{ siswa.kelas }}" required
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-fuchsia-500/50 focus:ring-2 focus:ring-fuchsia-500/20 transition duration-200"
            placeholder="Contoh: XI IPA 1" />
        </label>
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">NIS</span>
          <input name="nis" type="text" inputmode="numeric" value="{{ siswa.nis }}" required
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-fuchsia-500/50 focus:ring-2 focus:ring-fuchsia-500/20 transition duration-200 font-mono" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</span>
          <select name="status" required
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white outline-none focus:border-fuchsia-500/50 focus:ring-2 focus:ring-fuchsia-500/20 transition duration-200">
            <option value="Aktif" {% if siswa.status == "Aktif" %}selected{% endif %}>Aktif</option>
            <option value="Nonaktif" {% if siswa.status == "Nonaktif" %}selected{% endif %}>Nonaktif</option>
          </select>
        </label>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800/60">
        <a href="{% url 'list_siswa' %}"
          class="rounded-2xl border border-slate-800 bg-slate-900/40 px-5 py-3 text-slate-300 hover:text-white transition duration-200 font-semibold">
          Batal
        </a>
        <button type="submit"
          class="rounded-2xl bg-gradient-to-r from-fuchsia-500 to-brand-600 px-6 py-3 text-white shadow-lg shadow-fuchsia-500/15 hover:shadow-fuchsia-500/25 transition duration-200 font-semibold">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
