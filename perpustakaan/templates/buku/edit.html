{% extends 'nav.html' %} {% block title %} Edit Buku - Sistem Peminjaman Buku SIPUSTAKA {% endblock %} {% block content %}
<div class="flex flex-col gap-6 text-sm">
  <!-- Back Button & Header -->
  <div class="flex items-center gap-3">
    <a href="{% url 'list_buku' %}" class="text-slate-400 hover:text-white transition duration-200">
      <span class="material-icons-outlined text-xl">arrow_back</span>
    </a>
    <div>
      <p class="text-xs uppercase tracking-wider text-cyan-400 font-semibold mb-1">EDIT DATA</p>
      <h3 class="text-2xl font-black text-white">Edit Buku</h3>
    </div>
  </div>

  <!-- Form Card -->
  <div class="rounded-[2rem] bg-slate-900/40 border border-slate-800/70 p-6 md:p-8 backdrop-blur-md shadow-xl max-w-4xl">
    <form id="form-edit-book" method="post" action="{% url 'edit_buku' buku.id %}" class="space-y-6">
      {% csrf_token %}

      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Judul Buku</span>
          <input name="judul" type="text" value="{{ buku.judul }}" required
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pengarang</span>
          <input name="pengarang" type="text" value="{{ buku.pengarang }}"
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200" />
        </label>
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Kategori</span>
          <input name="kategori" type="text" value="{{ buku.kategori }}"
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Penerbit</span>
          <input name="penerbit" type="text" value="{{ buku.penerbit }}"
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200" />
        </label>
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tahun Terbit</span>
          <input name="tahun" type="number" min="0" value="{{ buku.tahun }}"
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">ISBN</span>
          <input name="isbn" type="text" value="{{ buku.isbn }}"
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200"
            placeholder="978-979-..." />
        </label>
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rak / Lokasi</span>
          <input name="rak" type="text" value="{{ buku.rak }}"
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200"
            placeholder="Contoh: A1" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Stok</span>
          <input name="stok" type="number" min="0" value="{{ buku.stok }}"
            class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200" />
        </label>
      </div>

      <label class="block">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Deskripsi</span>
        <textarea name="deskripsi" rows="4"
          class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950/60 px-4 py-3 text-white placeholder-slate-600 outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition duration-200"
          placeholder="Masukkan deskripsi buku...">{{ buku.deskripsi }}</textarea>
      </label>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800/60">
        <a href="{% url 'list_buku' %}"
          class="rounded-2xl border border-slate-800 bg-slate-900/40 px-5 py-3 text-slate-300 hover:text-white transition duration-200 font-semibold">
          Batal
        </a>
        <button type="submit"
          class="rounded-2xl bg-gradient-to-r from-cyan-500 to-brand-600 px-6 py-3 text-white shadow-lg shadow-cyan-500/15 hover:shadow-cyan-500/25 transition duration-200 font-semibold">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
