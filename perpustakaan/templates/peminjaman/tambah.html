{% extends 'nav.html' %} {% block title %} Tambah Peminjaman - Sistem Peminjaman Buku SIPUSTAKA {% endblock %} {% block content %}
<div class="flex flex-col gap-6 text-sm">
  <!-- Back Button & Header -->
  <div class="flex items-center gap-3">
    <a href="{% url 'list_peminjam' %}" class="text-slate-400 hover:text-white transition duration-200">
      <span class="material-icons-outlined text-xl">arrow_back</span>
    </a>
    <div>
      <p class="text-xs uppercase tracking-wider text-amber-400 font-semibold mb-1">TRANSAKSI BARU</p>
      <h1 class="text-2xl font-black text-white">Pinjam Buku</h1>
    </div>
  </div>

  <!-- Form Card -->
  <div class="rounded-[2rem] bg-slate-900/40 border border-slate-800/70 p-6 md:p-8 backdrop-blur-md shadow-xl max-w-4xl">
    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <!-- Row 1: Nama Peminjam & Pilih Buku -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- Nama Peminjam -->
        <div>
          <label for="nama_peminjam" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            Nama Peminjam
          </label>  
          <select id="nama_peminjam" name="nama_peminjam" required
            class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition duration-200">
            <option value="" disabled selected hidden>Pilih Peminjam</option>
            {% for siswa in siswa_list %}
            <option value="{{ siswa.nama }}">{{ siswa.nama }} - {{ siswa.kelas }} ({{ siswa.nis }})</option>
            {% endfor %}
          </select>
        </div>

        <!-- Pilih Buku -->
        <div>
          <label for="buku" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            Pilih Buku
          </label>
          <select id="buku" name="buku" required
            class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition duration-200">
            <option value="" disabled selected hidden>Pilih Buku</option>
            {% for buku in buku_list %}
            <option value="{{ buku.judul }}">{{ buku.judul }} ({{ buku.stok }} stok)</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Row 2: Tanggal Pinjam & Jatuh Tempo -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="tanggal_pinjam" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            Tanggal Pinjam
          </label>
          <input type="date" id="tanggal_pinjam" name="tanggal_pinjam" required
            class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition duration-200 [color-scheme:dark]" />
        </div>
        <div>
          <label for="jatuh_tempo" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            Tanggal Jatuh Tempo
          </label>
          <input type="date" id="jatuh_tempo" name="jatuh_tempo" required
            class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition duration-200 [color-scheme:dark]" />
        </div>
      </div>

      <!-- Row 3: Keterangan & Petugas -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="keterangan" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            Keterangan
          </label>
          <select id="keterangan" name="keterangan"
            class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition duration-200">
            <option value="">Pilih Keterangan</option>
            <option value="Bacaan pribadi">Bacaan pribadi</option>
            <option value="Tugas sekolah">Tugas sekolah</option>
            <option value="Referensi">Referensi</option>
            <option value="Penelitian">Penelitian</option>
            <option value="Hiburan">Hiburan</option>
          </select>
        </div>
        <div>
          <label for="petugas" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
            Petugas
          </label>
          <input type="text" id="petugas" name="petugas" required placeholder="Nama petugas"
            class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white placeholder-slate-600 outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition duration-200" />
        </div>
      </div>

      <!-- Row 4: Catatan -->
      <div>
        <label for="catatan" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
          Catatan Tambahan
        </label>
        <textarea id="catatan" name="catatan" rows="3" placeholder="Contoh: buku untuk tugas Bahasa Indonesia..."
          class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white placeholder-slate-600 outline-none focus:border-amber-500/50 focus:ring-2 focus:ring-amber-500/20 transition duration-200"></textarea>
      </div>

      <!-- Buttons -->
      <div class="flex gap-3 pt-4 border-t border-slate-800/60">
        <a href="{% url 'list_peminjam' %}"
          class="rounded-2xl border border-slate-800 bg-slate-900/40 px-5 py-3 text-slate-300 hover:text-white transition duration-200 font-semibold">
          Batal
        </a>
        <button type="submit"
          class="px-8 py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl font-semibold shadow-lg shadow-amber-500/15 hover:shadow-amber-500/25 transition duration-200">
          Pinjam Buku
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  document.getElementById("tanggal_pinjam").valueAsDate = new Date();
  const jatuhTempoDate = new Date();
  jatuhTempoDate.setDate(jatuhTempoDate.getDate() + 7);
  document.getElementById("jatuh_tempo").valueAsDate = jatuhTempoDate;
</script>
{% endblock %}
