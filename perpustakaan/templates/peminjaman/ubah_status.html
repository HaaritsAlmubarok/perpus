{% extends 'nav.html' %} {% block title %} Ubah Status Peminjaman - Sistem Peminjaman Buku SIPUSTAKA {% endblock %} {% block content %}
<div class="flex flex-col gap-6 text-sm">
  <!-- Back Button & Header -->
  <div class="flex items-center gap-3">
    <a href="{% url 'list_peminjam' %}" class="text-slate-400 hover:text-white transition duration-200">
      <span class="material-icons-outlined text-xl">arrow_back</span>
    </a>
    <div>
      <p class="text-xs uppercase tracking-wider text-blue-400 font-semibold mb-1">UPDATE STATUS</p>
      <h3 class="text-2xl font-black text-white">Ubah Status Peminjaman</h3>
    </div>
  </div>

  <!-- Form Card -->
  <div class="rounded-[2rem] bg-slate-900/40 border border-slate-800/70 p-6 md:p-8 backdrop-blur-md shadow-xl max-w-lg">
    <!-- Info -->
    <div class="grid gap-4 sm:grid-cols-2 mb-6">
      <div class="rounded-2xl bg-slate-950/40 border border-slate-800/60 p-4">
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Peminjam</p>
        <p class="text-sm font-bold text-white">{{ peminjaman.nama_peminjam }}</p>
      </div>
      <div class="rounded-2xl bg-slate-950/40 border border-slate-800/60 p-4">
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Buku</p>
        <p class="text-sm font-bold text-white">{{ peminjaman.buku }}</p>
      </div>
    </div>

    <form method="POST" class="space-y-6">
      {% csrf_token %}
      <div>
        <label for="status" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
          Status Peminjaman
        </label>
        <select id="status" name="status" required
          class="w-full px-4 py-3 border border-slate-800 bg-slate-950/60 rounded-2xl text-white outline-none focus:border-blue-500/50 focus:ring-2 focus:ring-blue-500/20 transition duration-200">
          <option value="Dipinjam" {% if peminjaman.status == 'Dipinjam' %}selected{% endif %}>Dipinjam</option>
          <option value="Dikembalikan" {% if peminjaman.status == 'Dikembalikan' %}selected{% endif %}>Dikembalikan</option>
        </select>
      </div>

      <div class="flex gap-3 pt-4 border-t border-slate-800/60">
        <a href="{% url 'list_peminjam' %}"
          class="rounded-2xl border border-slate-800 bg-slate-900/40 px-5 py-3 text-slate-300 hover:text-white transition duration-200 font-semibold">
          Batal
        </a>
        <button type="submit"
          class="px-6 py-3 bg-gradient-to-r from-blue-500 to-brand-600 text-white rounded-2xl font-semibold shadow-lg shadow-blue-500/15 hover:shadow-blue-500/25 transition duration-200">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
